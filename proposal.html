<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7ddd5" />
  <title>For The Rest Of Our Lives | Zareef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="proposal-page">
  <div class="page-noise" aria-hidden="true"></div>
  <main class="proposal-shell">
    <div class="proposal-sparkles" aria-hidden="true">✦ ✧ ✦</div>
    <p class="proposal-eyebrow">One last question</p>
    <h1>So Zareef Abtahee,<br /><em>will you be mine?</em></h1>
    <p class="proposal-question">For the rest of your life?</p>
    <div class="proposal-heart" aria-hidden="true">♡</div>
    <div class="proposal-options" aria-label="Choose your answer">
      <button class="proposal-choice proposal-yes" data-answer="yes">YES <span>♡</span></button>
      <button class="proposal-choice proposal-no" data-answer="no">NO <span>♡</span></button>
    </div>
    <p class="proposal-response" id="proposal-response" aria-live="polite"></p>
  </main>
  <script src="proposal.js"></script>
</body>
</html>
