<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d1d" />
  <title>One Last Thing | Zareef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="final-page">
  <div class="page-noise" aria-hidden="true"></div>
  <main class="final-shell">
    <section class="final-content" aria-labelledby="final-title">
      <p class="final-eyebrow">One last thing</p>
      <h1 id="final-title">Before you <em>leave...</em></h1>
      <p class="final-subtitle">There is one tiny envelope waiting under the stars.</p>
      <button class="final-envelope-button" id="final-envelope" type="button" aria-expanded="false" aria-controls="final-message">
        <span class="final-envelope-label">Before you leave...</span>
      </button>
      <p class="final-message" id="final-message" aria-live="polite">
        I couldn't be there in Canada to celebrate with you, so I brought a tiny piece of Dhaka to your screen instead.
        <strong>🎂 Happy Birthday, Zareef. ❤️</strong>
      </p>
    </section>
  </main>
  <script src="final.js"></script>
</body>
</html>
